name: CI-0 Docker spike

# The custom-indicator worker as a sidecar container: probes what it can reach and checks
# the limits. Nothing is pushed anywhere.
on:
  push:
    branches: [custom-indicators]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t openchart:ci .
      - name: Run the sidecar probes
        run: |
          mkdir -p out && chmod 777 out
          docker compose -f tools/ci0_spike/docker/compose.spike.yml up --abort-on-container-exit --exit-code-from server
      - name: Report
        if: always()
        run: cat out/report.json || true
      - name: Tidy up
        if: always()
        run: docker compose -f tools/ci0_spike/docker/compose.spike.yml down -v
