name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          # tests/test_worker_windows.py: an AppContainer with decoys in Credential Manager
          # and the registry, on the runner only (never on someone's own PC by default).
          OPENCHART_TEST_APPCONTAINER: ${{ runner.os == 'Windows' && '1' || '' }}
          OPENCHART_TEST_REPORT_DIR: ${{ runner.temp }}
      - name: The AppContainer probe table
        if: always() && runner.os == 'Windows'
        shell: bash
        run: cat "$RUNNER_TEMP/appcontainer-probes.txt" || echo "no probe table (the test did not run)"

  windows-package:
    # The release build (server folder and viewer), smoke-tested; then the service installer on
    # the runner, installed and reinstalled over the running service, with the indicator
    # sandbox checked as LocalSystem (AppContainer, probes, private desktop, uninstall
    # proof). Nothing is kept.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install . pyinstaller pywebview packaging
      - name: Build and smoke-test
        shell: pwsh
        run: .\packaging\build-windows.ps1 -Python python
      - name: Licence files in both zips
        shell: pwsh
        run: |
          foreach ($zip in Get-ChildItem dist\*.zip) {
            $names = (Expand-Archive $zip -DestinationPath "check\$($zip.BaseName)" -PassThru).Name
            foreach ($f in "LICENSE.txt", "NOTICE.txt", "THIRD-PARTY-LICENSES.txt") {
              if ($names -notcontains $f) { throw "$f missing from $($zip.Name)" }
            }
          }
      - name: NSSM 2.24 (checksum verified)
        shell: pwsh
        env:
          NSSM_URL: https://nssm.cc/release/nssm-2.24.zip
          NSSM_SHA256: 727d1e42275c605e0f04aba98095c38a8e1e46def453cdffce42869428aa6743
        run: |
          foreach ($i in 1..5) {
            try { Invoke-WebRequest $env:NSSM_URL -OutFile nssm.zip; break } catch { Start-Sleep 10 }
          }
          $hash = (Get-FileHash nssm.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:NSSM_SHA256) { throw "nssm.zip has SHA-256 $hash, expected $env:NSSM_SHA256" }
          Expand-Archive nssm.zip -DestinationPath nssm
      - name: Install the service, then reinstall over it while it runs
        shell: pwsh
        run: |
          $release = (Get-ChildItem dist -Directory -Filter "OpenChart-Server-*-windows").FullName
          .\tools\ci\service-reinstall-test.ps1 -Release $release -Nssm nssm\nssm-2.24\win64\nssm.exe -Work $env:RUNNER_TEMP

  docker:
    # Builds the image and runs it on a test volume; nothing is pushed anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t openchart:ci .
      - name: Self-test inside the image
        run: docker run --rm openchart:ci openchart self-test
      - name: Licence files ship in the image, and it runs as a non-root user
        run: |
          docker run --rm openchart:ci sh -c 'test -s /usr/share/doc/openchart/LICENSE && test -s /usr/share/doc/openchart/NOTICE && grep -q "Lightweight Charts" /usr/share/doc/openchart/NOTICE && id -u' | tee uid.txt
          test "$(tail -1 uid.txt)" != "0"
      - name: Start with docker compose, wait until healthy
        env:
          OPENCHART_BIND: 127.0.0.1
          OPENCHART_PORT: "18000"
        run: |
          echo "OPENCHART_SECRET_KEY=$(docker run --rm openchart:ci openchart secrets new-key)" > .env
          docker compose config --quiet
          docker image tag openchart:ci openchart:local
          docker compose up -d --no-build
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q openchart)")
            echo "health: $status"
            [ "$status" = healthy ] && break
            sleep 3
          done
          test "$status" = healthy
          curl -fsS http://127.0.0.1:18000/api/health
          curl -fsS http://127.0.0.1:18000/ | grep -q 'id="app"'
          curl -fsS http://127.0.0.1:18000/api/setup/status
          docker compose logs openchart | grep -q "secrets: encrypted file /data/secrets.enc"
          docker compose exec -T openchart sh -c 'test -f /data/openchart.db && openchart backup && ls /data/backups'
      - name: Custom indicators run in the sidecar, with the minimum isolation
        run: |
          for i in $(seq 1 30); do
            docker compose logs openchart | grep -q "indicator sandbox: " && break
            sleep 2
          done
          docker compose logs openchart | grep "indicator sandbox"
          docker compose logs openchart | grep -q "indicator sandbox: ready (sidecar)"
          # The same probes from a second connection, and a script on 5,000 bars.
          docker compose exec -T openchart openchart sandbox check | tee check.txt
          grep -q "Minimum isolation: met" check.txt
          # The sidecar: its own uid, no data volume, no network interface but loopback.
          docker compose exec -T indicator-worker sh -c 'test "$(id -u)" = 10002 && test ! -e /data/openchart.db && test "$(ls /sys/class/net)" = lo'
      - name: Not reachable from other addresses when bound to 127.0.0.1
        run: |
          ip=$(hostname -I | awk '{print $1}')
          ! curl -fsS --max-time 3 "http://$ip:18000/api/health"
      - name: Logs
        if: always()
        run: docker compose logs || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
