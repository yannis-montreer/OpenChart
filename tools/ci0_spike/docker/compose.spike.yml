# CI-0 spike: the sidecar shape proposed for Docker (design section 3.3), with a stand-in
# server. Run from the repository root after `docker build -t openchart:ci .`:
#   docker compose -f tools/ci0_spike/docker/compose.spike.yml up --abort-on-container-exit --exit-code-from server
# No port is published: the stand-in server's port 8000 exists only on the project network.
name: ocspike
services:
  server:
    image: openchart:ci
    user: "10001"
    command: ["python", "/spike/docker/docker_server.py"]
    environment:
      OPENCHART_SECRET_KEY: decoy-not-a-key
    volumes:
      - spike-data:/data
      - worker-socket:/run/ocw
      - ../:/spike:ro
      - ../../../out:/out
    depends_on: [worker]

  worker:
    image: openchart:ci
    user: "10002"
    command: ["python", "-I", "/spike/docker/docker_worker.py", "--listen", "/run/ocw/sock"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 32
    environment:
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - worker-socket:/run/ocw
      - ../:/spike:ro

volumes:
  spike-data:
  worker-socket:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "mode=1777,size=1m" }
