[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openchart"
description = "Self-hosted charting and alerting server for forex and metals."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pyarrow>=17",
    "pandas>=2.2",
    "numpy>=1.26",
    "argon2-cffi>=23.1",
    "keyring>=25",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
openchart = "openchart.main:main"

[tool.hatch.version]
path = "src/openchart/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openchart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: needs real OANDA credentials in .env (skipped otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["SPEC.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
